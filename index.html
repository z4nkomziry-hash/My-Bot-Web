    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;500;600;700;800;900&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0a0a1a;--text:#fff;--muted:#94a3b8;--glass:rgba(255,255,255,0.03);--border:rgba(255,255,255,0.06);--pink:#ec4899;--violet:#a855f7}
        .light-mode{--bg:#f8fafc;--text:#0f172a;--muted:#64748b;--glass:rgba(15,23,42,0.03);--border:rgba(15,23,42,0.08)}
        body{font-family:'Noto Kufi Arabic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:all 0.3s ease;line-height:1.6}
        ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--pink),var(--violet));border-radius:10px}
        .glass{background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:24px;transition:all 0.3s ease}
        .glass:hover{border-color:rgba(255,255,255,0.12)}
        .btn{background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;font-weight:700;border:none;cursor:pointer;border-radius:20px;padding:16px 28px;box-shadow:0 4px 25px rgba(236,72,153,0.25);transition:all 0.3s ease}
        .btn:hover{transform:translateY(-2px);box-shadow:0 8px 40px rgba(236,72,153,0.4)}
        .btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
        .input{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:16px;padding:16px 50px;color:var(--text);width:100%;font-size:14px;font-family:inherit;transition:all 0.3s ease}
        .input:focus{outline:none;border-color:var(--pink)}
        .input::placeholder{color:#64748b}
        .modal{display:flex;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.75);backdrop-filter:blur(12px);align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:all 0.3s ease}
        .modal.show{opacity:1;pointer-events:auto}
        .modal-inner{transform:scale(0.85);transition:all 0.3s ease}
        .modal.show .modal-inner{transform:scale(1)}
        .toast-container{position:fixed;top:20px;right:20px;z-index:10000;display:flex;flex-direction:column;gap:8px}
        .toast{background:rgba(15,23,42,0.95);border:1px solid rgba(255,255,255,0.1);padding:14px 18px;border-radius:16px;color:#fff;font-size:13px;font-weight:600;animation:slideIn 0.35s ease}
        @keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
        .rotate-180{transform:rotate(180deg)}
        @media(max-width:640px){.input{padding:14px 40px;font-size:13px}.btn{padding:14px 20px;font-size:13px}}
    </style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<!-- Welcome Modal -->
<div id="welcomeModal" class="modal show">

        <div class="grid grid-cols-2 gap-2">
            <button onclick="selectPlatform('TikTok')" class="flex items-center gap-2 p-3 rounded-2xl bg-white/[0.02] border border-white/5 hover:border-rose-500/50 transition-all text-sm font-bold"><i class="fa-brands fa-tiktok text-rose-500"></i> TikTok</button>
            <button onclick="selectPlatform('Instagram')" class="flex items-center gap-2 p-3 rounded-2xl bg-white/[0.02] border border-white/5 hover:border-pink-500/50 transition-all text-sm font-bold"><i class="fa-brands fa-instagram text-pink-500"></i> Instagram</button>

            <button onclick="selectPlatform('Facebook')" class="flex items-center gap-2 p-3 rounded-2xl bg-white/[0.02] border border-white/5 hover:border-sky-500/50 transition-all text-sm font-bold"><i class="fa-brands fa-facebook text-sky-500"></i> Facebook</button>
            <button onclick="selectPlatform('Snapchat')" class="flex items-center gap-2 p-3 rounded-2xl bg-white/[0.02] border border-white/5 hover:border-amber-400/50 transition-all text-sm font-bold"><i class="fa-brands fa-snapchat text-amber-400"></i> Snapchat</button>
            <button onclick="selectPlatform('Pinterest')" class="flex items-center gap-2 p-3 rounded-2xl bg-white/[0.02] border border-white/5 hover:border-red-600/50 transition-all text-sm font-bold"><i class="fa-brands fa-pinterest text-red-600"></i> Pinterest</button>

</div>

<!-- Header -->
<header class="border-b border-white/5 py-3 px-4 sticky top-0 z-40 bg-[#0a0a1a]/85 backdrop-blur-2xl">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
        <a href="/" class="flex items-center gap-2.5 group">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-pink-500 to-violet-600 flex items-center justify-center shadow-lg shadow-pink-500/25 group-hover:shadow-pink-500/50 transition-all">
                <i class="fa-solid fa-bolt text-white text-sm"></i>

            <span class="text-xl font-extrabold"><span class="text-white">KRD-</span><span class="bg-gradient-to-r from-pink-400 to-violet-400 bg-clip-text text-transparent">ProDown</span></span>

</header>

<!-- Main -->
<main class="max-w-3xl mx-auto px-4 py-8">
    <div class="text-center mb-8">
        <h1 class="text-3xl sm:text-4xl font-extrabold mb-2">دابەزێنەری <span class="bg-gradient-to-r from-pink-400 via-fuchsia-400 to-violet-400 bg-clip-text text-transparent">پڕۆفیشناڵ</span></h1>
        <p class="text-sm text-slate-400">٦ پلاتفۆرم | بێ واتەرمارک | کوالێتی بەرز | ٤ زمان</p>
    </div>

    <div class="glass p-5 sm:p-6 mb-5">
        <div class="relative">
            <i class="fa-solid fa-link absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
            <input type="text" id="videoUrl" placeholder="لینکی ڤیدیۆکە لێرە دابنێ..." class="input" autocomplete="off">
            <button onclick="pasteLink()" class="absolute left-3 top-1/2 -translate-y-1/2 text-xs bg-white/10 hover:bg-white/20 text-slate-300 px-3 py-1.5 rounded-lg flex items-center gap-1"><i class="fa-solid fa-paste text-[10px]"></i> پەیست</button>
        </div>
        <div id="platformBadge" class="hidden mt-2 text-[10px] text-slate-400 text-center font-bold"></div>
        <button id="downloadBtn" onclick="downloadVideo()" class="btn w-full mt-4 text-sm flex items-center justify-center gap-2"><i class="fa-solid fa-download"></i> دابەزێنە</button>
    </div>

    <div id="previewCard" class="hidden glass p-4 sm:p-5 mb-5">
        <video id="previewVideo" class="w-full max-h-[400px] object-contain rounded-xl bg-black" controls></video>
        <div class="mt-4 space-y-3">
            <div class="flex items-center justify-between"><h3 id="previewAuthor" class="font-bold text-sm"></h3><span id="previewPlatform" class="text-[10px] px-2 py-1 rounded-full bg-white/5 text-slate-400"></span></div>
            <div class="flex gap-2">
                <button onclick="downloadQuality('720p')" class="text-[10px] bg-white/5 border border-white/5 px-3 py-1 rounded-lg text-slate-400 hover:text-white transition-all">720p</button>
                <button onclick="downloadQuality('1080p')" class="text-[10px] bg-white/5 border border-white/5 px-3 py-1 rounded-lg text-slate-400 hover:text-white transition-all">1080p</button>
                <button onclick="downloadQuality('4K')" class="text-[10px] bg-white/5 border border-white/5 px-3 py-1 rounded-lg text-slate-400 hover:text-white transition-all">4K</button>
                <button onclick="extractAudio()" class="text-[10px] bg-amber-500/10 border border-amber-500/20 px-3 py-1 rounded-lg text-amber-400 hover:text-white transition-all">MP3</button>
            </div>
            <div class="flex gap-2">
                <button id="dlBtn" class="btn flex-1 py-2.5 text-xs rounded-xl"><i class="fa-solid fa-download ml-1"></i> داونلۆد</button>
                <button id="audioBtn" class="bg-white/5 border border-white/5 text-white py-2.5 px-4 rounded-xl text-xs"><i class="fa-solid fa-music"></i></button>
            </div>
        </div>
    </div>

    <!-- Support -->
    <div class="glass p-5 sm:p-6 mb-5 text-center">
        <button onclick="toggleSupport()" class="w-full flex items-center justify-between text-white font-bold text-sm"><span><i class="fa-solid fa-heart text-rose-400 ml-2"></i>پشتەڤانیا تە بۆ من</span><i id="supportArrow" class="fa-solid fa-chevron-down text-xs text-slate-400 transition-transform"></i></button>
        <div id="supportDropdown" class="hidden mt-4 space-y-3">
            <div class="grid grid-cols-2 gap-3">

                <a href="https://fastpay.iq" target="_blank" class="flex flex-col items-center gap-2 bg-pink-500/5 border border-pink-500/20 rounded-2xl p-4 hover:bg-pink-500/10 transition-all"><i class="fa-solid fa-bolt text-pink-400 text-xl"></i><span class="text-xs font-bold">FastPay</span><code class="text-[10px] text-pink-400">+964 750 604 5491</code></a>
            </div>
        </div>
    </div>

    <!-- Contact -->
    <div class="glass p-5 sm:p-6 mb-5 text-center">
        <button onclick="toggleContact()" class="w-full flex items-center justify-between text-white font-bold text-sm"><span><i class="fa-solid fa-address-book text-pink-400 ml-2"></i>پەیوەندی</span><i id="contactArrow" class="fa-solid fa-chevron-down text-xs text-slate-400 transition-transform"></i></button>
        <div id="contactDropdown" class="hidden mt-4 grid grid-cols-2 gap-2">
            <a href="tel:+9647506045491" class="flex flex-col items-center gap-2 bg-white/[0.02] border border-white/5 rounded-2xl p-3 hover:border-pink-500/30 transition-all"><i class="fa-solid fa-phone text-pink-400 text-lg"></i><span class="text-[10px] font-bold">تەلەفۆن</span></a>
            <a href="https://wa.me/9647506045491" target="_blank" class="flex flex-col items-center gap-2 bg-white/[0.02] border border-white/5 rounded-2xl p-3 hover:border-emerald-500/30 transition-all"><i class="fa-brands fa-whatsapp text-emerald-400 text-lg"></i><span class="text-[10px] font-bold">واتساپ</span></a>
            <a href="https://t.me/z_14x" target="_blank" class="flex flex-col items-center gap-2 bg-white/[0.02] border border-white/5 rounded-2xl p-3 hover:border-sky-500/30 transition-all"><i class="fa-brands fa-telegram text-sky-400 text-lg"></i><span class="text-[10px] font-bold">تێلێگرام</span></a>
            <a href="mailto:zaniyar.mzuri@email.com" class="flex flex-col items-center gap-2 bg-white/[0.02] border border-white/5 rounded-2xl p-3 hover:border-amber-500/30 transition-all"><i class="fa-solid fa-envelope text-amber-400 text-lg"></i><span class="text-[10px] font-bold">ئیمەیڵ</span></a>
        </div>
    </div>

    <footer class="text-center py-6">
        <p class="text-[10px] text-slate-600">© 2026 KRD-ProDown | گەشەپێدەر Zaniyar Al-Mzuri Al-Kurdi</p>
        <div class="flex justify-center gap-4 mt-2">
            <a href="https://t.me/z_14x" target="_blank" class="text-slate-600 hover:text-pink-400"><i class="fa-brands fa-telegram"></i></a>
            <a href="https://instagram.com/z44nko" target="_blank" class="text-slate-600 hover:text-pink-400"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://tiktok.com/@z44nko" target="_blank" class="text-slate-600 hover:text-pink-400"><i class="fa-brands fa-tiktok"></i></a>

</main>

<script>
let currentVideoUrl='',currentPlatform='',currentLang='badini';

function selectPlatform(n){currentPlatform=n;document.getElementById('welcomeModal').classList.remove('show');setTimeout(()=>document.getElementById('welcomeModal').style.display='none',300);toast('✅ '+n+' هەڵبژێردرا')}
function toggleTheme(){document.body.classList.toggle('light-mode');const l=document.body.classList.contains('light-mode');localStorage.setItem('theme',l?'light':'dark');document.getElementById('themeIcon').className=l?'fa-solid fa-sun text-xs':'fa-solid fa-moon text-xs'}
function toast(m){const c=document.getElementById('toastContainer');const t=document.createElement('div');t.className='toast';t.textContent=m;c.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(120%)';t.style.transition='0.3s';setTimeout(()=>t.remove(),300)},2500)}
function pasteLink(){navigator.clipboard.readText().then(t=>{document.getElementById('videoUrl').value=t;detectPlatform();toast('📋 لینک پەیست کرا')}).catch(()=>{})}
function changeLanguage(l){currentLang=l;localStorage.setItem('lang',l)}
function toggleContact(){document.getElementById('contactDropdown').classList.toggle('hidden');document.getElementById('contactArrow').classList.toggle('rotate-180')}
function toggleSupport(){document.getElementById('supportDropdown').classList.toggle('hidden');document.getElementById('supportArrow').classList.toggle('rotate-180')}
function downloadQuality(q){if(!currentVideoUrl)return;const a=document.createElement('a');a.href=currentVideoUrl;a.download='KRD-ProDown_'+q+'.mp4';a.target='_blank';document.body.appendChild(a);a.click();document.body.removeChild(a)}

function detectPlatform(){
    const u=document.getElementById('videoUrl').value.trim();
    const b=document.getElementById('platformBadge');
    if(!u){b.classList.add('hidden');return}
    const p={'tiktok.com':'🎵 TikTok','instagram.com':'📸 Instagram','youtube.com':'▶️ YouTube','youtu.be':'▶️ YouTube','facebook.com':'📘 Facebook','snapchat.com':'👻 Snapchat','pinterest.com':'📌 Pinterest'};
    for(const[d,n]of Object.entries(p)){if(u.includes(d)){b.classList.remove('hidden');b.textContent='🔍 '+n;currentPlatform=n;return}}
    b.classList.add('hidden')
}

async function extractAudio(){
    if(!currentVideoUrl)return toast('⚠️ سەرەتا ڤیدیۆ بدۆزەرەوە');
    try{
        const r=await fetch('https://api.cobalt.tools/api/json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:document.getElementById('videoUrl').value,isAudioOnly:true,aFormat:'mp3'})});
        const d=await r.json();
        if(d.url){const a=document.createElement('a');a.href=d.url;a.download='KRD-ProDown_Audio.mp3';a.target='_blank';document.body.appendChild(a);a.click();document.body.removeChild(a);toast('🎵 دەنگ ئامادەیە!')}
    }catch(e){toast('❌ نەتوانرا')}
}

async function downloadVideo(){
    const url=document.getElementById('videoUrl').value.trim();
    if(!url)return toast('⚠️ لینکی ڤیدیۆ بنووسە');
    const btn=document.getElementById('downloadBtn'),o=btn.innerHTML;btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin ml-2"></i> چاوەڕێ بە...';
    document.getElementById('previewCard').classList.add('hidden');
    try{
        let result;
        if(url.includes('tiktok.com')){
            const r=await fetch('https://www.tikwm.com/api/?url='+encodeURIComponent(url));const d=await r.json();
            if(d.code===0&&d.data){result={videoUrl:d.data.hdplay||d.data.play,audioUrl:d.data.music,author:d.data.author?.nickname||'TikTok',platform:'TikTok'}}
        }else{
            const r=await fetch('https://api.cobalt.tools/api/json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,vQuality:'720',filenamePattern:'basic'})});const d=await r.json();
            if(d.url||d.status==='redirect'||d.status==='stream'){result={videoUrl:d.url,audioUrl:d.url,author:currentPlatform||'Media',platform:currentPlatform||'Video'}}
            else if(d.status==='picker'&&d.picker?.length){result={images:d.picker.map(i=>i.url),platform:'Album'}}
        }
        if(result){
            if(result.images){showPhotos(result.images);toast('✅ ئەلبوم ئامادەیە!')}
            else{currentVideoUrl=result.videoUrl;showPreview(result);toast('✅ سەرکەوتوو بوو!')}
        }else{toast('❌ نەتوانرا داونلۆد بکرێت')}
    }catch(e){toast('❌ کێشەیەک ڕوویدا')}
    btn.disabled=false;btn.innerHTML=o
}

function showPreview(d){
    document.getElementById('previewCard').classList.remove('hidden');
    document.getElementById('previewVideo').src=d.videoUrl;
    document.getElementById('previewAuthor').textContent=d.author;
    document.getElementById('previewPlatform').textContent=d.platform;
    document.getElementById('dlBtn').onclick=()=>{const a=document.createElement('a');a.href=d.videoUrl;a.download='KRD-ProDown.mp4';a.target='_blank';document.body.appendChild(a);a.click();document.body.removeChild(a)};
    document.getElementById('audioBtn').onclick=()=>{const a=document.createElement('a');a.href=d.audioUrl;a.download='KRD-ProDown.mp3';a.target='_blank';document.body.appendChild(a);a.click();document.body.removeChild(a)};
    document.getElementById('previewCard').scrollIntoView({behavior:'smooth'})
}

function showPhotos(imgs){
    const c=document.createElement('div');c.className='glass p-4 sm:p-5 mb-5';c.innerHTML='<h3 class="font-bold text-sm mb-3">📸 ئەلبومی وێنەکان</h3><div class="grid grid-cols-3 gap-2">'+imgs.map((u,i)=>'<div class="relative group rounded-xl overflow-hidden aspect-square bg-slate-800"><img src="https://images.weserv.nl/?url='+encodeURIComponent(u)+'" class="w-full h-full object-cover" loading="lazy"><button onclick="(function(){const a=document.createElement(\'a\');a.href=\''+u+'\';a.download=\'KRD-ProDown_'+(i+1)+'.jpg\';a.target=\'_blank\';document.body.appendChild(a);a.click()})()" class="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 text-white text-xs font-bold"><i class="fa-solid fa-download ml-1"></i></button></div>').join('')+'</div>';
    document.getElementById('previewCard').insertAdjacentElement('afterend',c);
    c.scrollIntoView({behavior:'smooth'})
}

if(localStorage.getItem('theme')==='light'){document.body.classList.add('light-mode');document.getElementById('themeIcon').className='fa-solid fa-sun text-xs'}
window.addEventListener('DOMContentLoaded',()=>{setTimeout(()=>document.getElementById('welcomeModal').classList.add('show'),500)});
</script>
</body>
</html>
