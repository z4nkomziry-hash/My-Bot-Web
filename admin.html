<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRD-ProDown Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Noto Kufi Arabic',sans-serif;background:#0a0a1a;color:#fff;min-height:100vh}.sidebar{background:rgba(15,23,42,0.9);backdrop-filter:blur(20px);border-left:1px solid rgba(255,255,255,0.06)}.card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);border-radius:20px;padding:20px}.btn{background:linear-gradient(135deg,#ec4899,#a855f7);color:#fff;border:none;padding:12px 24px;border-radius:14px;font-weight:700;cursor:pointer}</style>
</head>
<body>
<div class="flex h-screen">
    <aside class="sidebar w-64 p-6 flex flex-col gap-6">
        <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-gradient-to-br from-pink-500 to-violet-600 flex items-center justify-center"><i class="fa-solid fa-bolt text-white"></i></div><span class="font-extrabold">Admin Panel</span></div>
        <nav class="flex flex-col gap-2">
            <a href="#" class="flex items-center gap-3 p-3 rounded-xl bg-pink-500/10 text-pink-400 font-bold"><i class="fa-solid fa-chart-line"></i> داشبۆرد</a>
            <a href="#" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 text-slate-400"><i class="fa-solid fa-download"></i> داونلۆدەکان</a>
            <a href="#" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 text-slate-400"><i class="fa-solid fa-users"></i> بەکارهێنەران</a>
            <a href="#" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 text-slate-400"><i class="fa-solid fa-gear"></i> ڕێکخستنەکان</a>
        </nav>
    </aside>
    <main class="flex-1 p-8 overflow-y-auto">
        <h1 class="text-2xl font-black mb-8">📊 داشبۆرد</h1>
        <div class="grid grid-cols-4 gap-4 mb-8" id="statsGrid"></div>
        <div class="card"><h3 class="font-bold mb-4">🕐 دوایین چالاکییەکان</h3><div id="recentActivity" class="space-y-2"></div></div>
    </main>
</div>
<script>
const d=JSON.parse(localStorage.getItem('krdpro_history')||'[]');
const u=JSON.parse(localStorage.getItem('krdpro_user')||'null');
const s=JSON.parse(localStorage.getItem('krdpro_subscribers')||'[]');
const td=localStorage.getItem('krdpro_total_downloads')||'0';
const f=localStorage.getItem('krdpro_followers')||'0';
document.getElementById('statsGrid').innerHTML='<div class="card"><i class="fa-solid fa-download text-pink-400 text-2xl mb-2"></i><p class="text-2xl font-black">'+td+'</p><p class="text-xs text-slate-400">کۆی داونلۆد</p></div><div class="card"><i class="fa-solid fa-users text-violet-400 text-2xl mb-2"></i><p class="text-2xl font-black">'+(s.length+(u?1:0))+'</p><p class="text-xs text-slate-400">بەکارهێنەر</p></div><div class="card"><i class="fa-solid fa-heart text-rose-400 text-2xl mb-2"></i><p class="text-2xl font-black">'+f+'</p><p class="text-xs text-slate-400">فۆڵۆوەر</p></div><div class="card"><i class="fa-solid fa-star text-amber-400 text-2xl mb-2"></i><p class="text-2xl font-black">4.8</p><p class="text-xs text-slate-400">ڕەیتینگ</p></div>';
document.getElementById('recentActivity').innerHTML=d.slice(0,10).map(h=>'<div class="flex justify-between bg-white/5 rounded-lg px-4 py-2 text-xs"><span class="text-slate-400">'+h.url.substring(0,60)+'</span><span class="text-slate-500">'+(h.platform||'')+'</span></div>').join('');
</script>
</body>
</html>
